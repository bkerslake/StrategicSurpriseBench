manifest:
  id: sable_patch
  title: Sable Patch
  version: 0.2.0
  domain: cyber and information security
  summary: Separate a criminal vendor compromise from later state exploitation and manipulated-media pressure without premature attribution.
  construct_tags: [cybersecurity, supply-chain, attribution, information-operations, compound-threat]
  collection_budgets: {1: 10, 2: 6}
  provenance:
    - title: CISA Cybersecurity Scenarios
      url: https://www.cisa.gov/resources-tools/resources/cybersecurity-scenarios
      license: U.S. Government work
      elements_used: Cross-sector incident response, vendor compromise, and public-private coordination.
      transformation: Replaced all actors, systems, evidence, causal mechanisms, and outcomes with a fictional compound incident.
    - title: Panopticon
      url: https://github.com/Max-Highsmith/panopticon
      license: MIT
      elements_used: Structured crisis injects and competing-source analysis.
      transformation: Used only the exercise chassis; no scenario text, hidden truth, or rubric was copied.

role: You advise the Ardent Republic Cyber Coordination Board during a cross-sector software incident.
background: >-
  Ardent utilities, ports, and hospitals use Asterline's Sable endpoint-management platform. The rival
  state of Kandar routinely probes Ardent networks, while financially motivated groups buy access from
  insiders. A disputed video appears to show a Kandari official discussing a campaign against Ardent.
  Several reports originate from the same threat-intelligence reseller and may not be independent.

hypotheses:
  - {id: "H1", label: "Planned Kandari supply-chain attack", description: "Kandar developed and deployed the Sable compromise as a centrally directed strategic attack."}
  - {id: "H2", label: "Criminal or insider compromise", description: "A financially motivated actor or vendor insider created the access for extortion and theft.", requires_generation: true, public_label: "Analyst-generated first-order alternative", public_description: "Formulate the strongest explanation that challenges the headline account without adding a second causal layer."}
  - {id: "H3", label: "Compound opportunistic exploitation", description: "Criminal access preceded selective Kandari exploitation and an information operation, creating distinct layers of responsibility.", requires_generation: true, public_label: "Analyst-generated second-order or compound alternative", public_description: "Formulate an omitted pathway involving incentives, indirect effects, a second actor, or multiple causal layers."}
  - {id: "H4", label: "Benign defect and panic", description: "A faulty update and manipulated reporting explain the disruption without malicious technical exploitation."}

rounds:
  - {round: 1, title: Trusted update failure, brief: "A signed Sable update precedes disruptions while a dramatic attribution video circulates.", common_evidence_ids: [SP-E01, SP-E02, SP-E03, SP-E04]}
  - {round: 2, title: Split provenance, brief: "Vendor and media forensics point to an insider origin but also reveal later state reconnaissance.", common_evidence_ids: [SP-E05, SP-E06]}
  - {round: 3, title: Selective activation, brief: "Kandari operators activate a subset of preexisting criminal access while the original broker seeks payment.", common_evidence_ids: [SP-E07, SP-E08]}

evidence:
  - {id: "SP-E01", round_available: 1, source: "Asterline incident notice", text: "A validly signed Sable update created privileged scheduled tasks at utilities, ports, and hospitals.", reliability: 0.84, deception_risk: 0.15, correlation_group: "vendor-reporting", supports: [H1, H2, H3], contradicts: [H4], public_inject: true}
  - {id: "SP-E02", round_available: 1, source: "Three security bulletins citing one reseller", text: "The bulletins attribute the update to Kandar using an identical rare-code-signature claim.", reliability: 0.52, deception_risk: 0.36, correlation_group: "reseller-feed", supports: [H1, H3], contradicts: [], public_inject: true}
  - {id: "SP-E03", round_available: 1, source: "Verified operational telemetry", text: "Most affected systems show no destructive action; outages cluster around automated containment and administrator shutdowns.", reliability: 0.93, deception_risk: 0.04, correlation_group: "operations-telemetry", supports: [H2, H3, H4], contradicts: [H1], public_inject: true}
  - {id: "SP-E04", round_available: 1, source: "Viral video and state media", text: "A clipped recording appears to show a Kandari deputy minister saying the Sable operation will make Ardent go dark.", reliability: 0.39, deception_risk: 0.79, correlation_group: "video-narrative", supports: [H1, H3], contradicts: [], public_inject: true}
  - {id: "SP-E05", round_available: 2, source: "Joint vendor and regulator audit", text: "A build engineer's token signed the update after unusual personal-debt payments from a criminal access broker.", reliability: 0.92, deception_risk: 0.05, correlation_group: "vendor-forensics", supports: [H2, H3], contradicts: [H1, H4], public_inject: true}
  - {id: "SP-E06", round_available: 2, source: "Independent network sensors", text: "Kandari infrastructure began enumerating only selected Sable hosts eleven days after the compromised update shipped.", reliability: 0.90, deception_risk: 0.08, correlation_group: "network-sensors", supports: [H3], contradicts: [H1, H4], public_inject: true}
  - {id: "SP-E07", round_available: 3, source: "Coordinated incident response", text: "Kandari operators use the preexisting Sable channel to interrupt two military-logistics terminals, while hospitals remain untouched.", reliability: 0.97, deception_risk: 0.03, correlation_group: "operations-telemetry", supports: [H3], contradicts: [H2, H4], public_inject: true}
  - {id: "SP-E08", round_available: 3, source: "Broker communications and payment ledger", text: "The broker complains that Kandar used stolen access without paying and attempts to extort Asterline with the original build logs.", reliability: 0.91, deception_risk: 0.08, correlation_group: "broker-finance", supports: [H2, H3], contradicts: [H1], public_inject: true}
  - {id: "SP-C01", round_available: 2, source: "Reproducible build comparison", text: "Unauthorized loader code entered after compilation and before signing through the engineer's token.", reliability: 0.96, deception_risk: 0.02, correlation_group: "vendor-forensics", supports: [H2, H3], contradicts: [H4]}
  - {id: "SP-C02", round_available: 2, source: "Code-history analysis", text: "The loader shares commodity access-broker libraries but no distinctive Kandari development artifacts.", reliability: 0.86, deception_risk: 0.11, correlation_group: "malware-provenance", supports: [H2, H3], contradicts: [H1]}
  - {id: "SP-C03", round_available: 2, source: "Financial investigation", text: "An intermediary linked to the build engineer received cryptocurrency from a known criminal broker two weeks before signing.", reliability: 0.91, deception_risk: 0.05, correlation_group: "broker-finance", supports: [H2, H3], contradicts: [H1, H4]}
  - {id: "SP-C04", round_available: 2, source: "Cross-sector telemetry", text: "Kandari scanning targets military logistics and border communications rather than the broad victim set installed by the update.", reliability: 0.92, deception_risk: 0.05, correlation_group: "network-sensors", supports: [H3], contradicts: [H1]}
  - {id: "SP-C05", round_available: 2, source: "Video provenance laboratory", text: "The deputy minister spoke the quoted words in two separate meetings; audio and scene edits falsely combine them into an operational admission.", reliability: 0.94, deception_risk: 0.03, correlation_group: "video-forensics", supports: [H3, H4], contradicts: [H1]}
  - {id: "SP-C06", round_available: 2, source: "Threat-report citation graph", text: "All three bulletins derive their rare-signature claim from one unverified reseller analyst.", reliability: 0.89, deception_risk: 0.07, correlation_group: "reseller-feed", supports: [H4], contradicts: [H1]}
  - {id: "SP-C07", round_available: 2, source: "Safe configuration review", text: "Network isolation stops command traffic while essential local Sable functions continue, permitting targeted containment.", reliability: 0.95, deception_risk: 0.02, correlation_group: "mitigation-testing", supports: [H2, H3], contradicts: []}
  - {id: "SP-C08", round_available: 2, source: "Kandari internal policy reporting", text: "Cyber commanders were told to exploit useful foreign access but were not informed of Sable before its public disclosure.", reliability: 0.78, deception_risk: 0.18, correlation_group: "kandari-intent", supports: [H3], contradicts: [H1]}
  - {id: "SP-D01", round_available: 3, source: "Operator-infrastructure analysis", text: "The activation servers are Kandari government infrastructure, but their first contact with the broker channel occurs after public vendor reporting.", reliability: 0.93, deception_risk: 0.05, correlation_group: "network-sensors", supports: [H3], contradicts: [H1]}
  - {id: "SP-D02", round_available: 3, source: "Broker marketplace seizure", text: "The Sable access listing predates Kandari use and advertises extortion and resale to any buyer.", reliability: 0.94, deception_risk: 0.04, correlation_group: "broker-finance", supports: [H2, H3], contradicts: [H1]}
  - {id: "SP-D03", round_available: 3, source: "Hospital resilience audit", text: "Segmented hospitals complete targeted remediation without care disruption or evidence of operator activation.", reliability: 0.91, deception_risk: 0.04, correlation_group: "mitigation-testing", supports: [H3], contradicts: [H1]}
  - {id: "SP-D04", round_available: 3, source: "Military logistics forensics", text: "Two terminals received destructive commands using the broker implant and Kandari operator credentials.", reliability: 0.97, deception_risk: 0.02, correlation_group: "operations-telemetry", supports: [H3], contradicts: [H2, H4]}
  - {id: "SP-D05", round_available: 3, source: "Allied intelligence liaison", text: "Allies independently observe Kandari teams searching criminal marketplaces for newly disclosed access.", reliability: 0.87, deception_risk: 0.09, correlation_group: "allied-intelligence", supports: [H3], contradicts: [H1]}
  - {id: "SP-D06", round_available: 3, source: "Asterline governance review", text: "Weak token custody and missing dual approval enabled the compromise, but routine product code was not designed for sabotage.", reliability: 0.93, deception_risk: 0.03, correlation_group: "vendor-governance", supports: [H2, H3], contradicts: [H1, H4]}
  - {id: "SP-D07", round_available: 3, source: "Narrative propagation analysis", text: "Kandari state outlets amplify the edited video after activation, while the original edit came from an unaffiliated influence-for-hire firm.", reliability: 0.88, deception_risk: 0.08, correlation_group: "video-narrative", supports: [H3], contradicts: [H1]}
  - {id: "SP-D08", round_available: 3, source: "Recovery dashboard", text: "Phased credential revocation and network segmentation restore most services faster than full emergency removal.", reliability: 0.95, deception_risk: 0.02, correlation_group: "mitigation-testing", supports: [H3], contradicts: []}

collection_actions:
  - {id: "SP-A01", round_available: 1, label: "Reproduce the signed build", description: "Locate where unauthorized code entered the release process.", cost: 3, correlation_group: "vendor-forensics", likelihood_positive: {H1: 0.75, H2: 0.85, H3: 0.88, H4: 0.12}, observed: "positive", return_evidence_id: "SP-C01"}
  - {id: "SP-A02", round_available: 1, label: "Compare code provenance", description: "Test state-specific versus commodity development origins.", cost: 2, correlation_group: "malware-provenance", likelihood_positive: {H1: 0.84, H2: 0.32, H3: 0.45, H4: 0.18}, observed: "negative", return_evidence_id: "SP-C02"}
  - {id: "SP-A03", round_available: 1, label: "Trace insider payments", description: "Test criminal recruitment of vendor personnel.", cost: 3, correlation_group: "broker-finance", likelihood_positive: {H1: 0.18, H2: 0.88, H3: 0.82, H4: 0.10}, observed: "positive", return_evidence_id: "SP-C03"}
  - {id: "SP-A04", round_available: 1, label: "Compare victim selection", description: "Distinguish broad access from selective operator tasking.", cost: 2, correlation_group: "network-sensors", likelihood_positive: {H1: 0.76, H2: 0.35, H3: 0.91, H4: 0.12}, observed: "positive", return_evidence_id: "SP-C04"}
  - {id: "SP-A05", round_available: 1, label: "Authenticate the attribution video", description: "Determine whether the apparent admission is genuine and contextual.", cost: 2, correlation_group: "video-forensics", likelihood_positive: {H1: 0.82, H2: 0.18, H3: 0.55, H4: 0.70}, observed: "negative", return_evidence_id: "SP-C05"}
  - {id: "SP-A06", round_available: 1, label: "Audit threat-report dependencies", description: "Identify circular reporting and shared claims.", cost: 1, correlation_group: "reseller-feed", likelihood_positive: {H1: 0.30, H2: 0.45, H3: 0.50, H4: 0.82}, observed: "positive", return_evidence_id: "SP-C06"}
  - {id: "SP-A07", round_available: 1, label: "Test targeted containment", description: "Find reversible mitigation that preserves critical functions.", cost: 2, correlation_group: "mitigation-testing", likelihood_positive: {H1: 0.55, H2: 0.75, H3: 0.80, H4: 0.65}, observed: "positive", return_evidence_id: "SP-C07"}
  - {id: "SP-A08", round_available: 1, label: "Collect Kandari intent", description: "Test whether the state planned or opportunistically adopted access.", cost: 4, correlation_group: "kandari-intent", likelihood_positive: {H1: 0.88, H2: 0.12, H3: 0.76, H4: 0.10}, observed: "positive", return_evidence_id: "SP-C08"}
  - {id: "SP-B01", round_available: 2, label: "Time operator infrastructure", description: "Establish when Kandari systems first used the channel.", cost: 2, correlation_group: "network-sensors", likelihood_positive: {H1: 0.88, H2: 0.20, H3: 0.84, H4: 0.08}, observed: "positive", return_evidence_id: "SP-D01"}
  - {id: "SP-B02", round_available: 2, label: "Seize broker marketplace records", description: "Establish access origin, timing, and customers.", cost: 3, correlation_group: "broker-finance", likelihood_positive: {H1: 0.15, H2: 0.92, H3: 0.90, H4: 0.08}, observed: "positive", return_evidence_id: "SP-D02"}
  - {id: "SP-B03", round_available: 2, label: "Audit hospital activation", description: "Test public-safety exposure and containment efficacy.", cost: 2, correlation_group: "mitigation-testing", likelihood_positive: {H1: 0.75, H2: 0.45, H3: 0.55, H4: 0.18}, observed: "negative", return_evidence_id: "SP-D03"}
  - {id: "SP-B04", round_available: 2, label: "Image logistics terminals", description: "Attribute destructive commands and their access path.", cost: 3, correlation_group: "operations-telemetry", likelihood_positive: {H1: 0.86, H2: 0.42, H3: 0.92, H4: 0.08}, observed: "positive", return_evidence_id: "SP-D04"}
  - {id: "SP-B05", round_available: 2, label: "Request allied observations", description: "Seek independent evidence of Kandari access acquisition behavior.", cost: 2, correlation_group: "allied-intelligence", likelihood_positive: {H1: 0.72, H2: 0.25, H3: 0.87, H4: 0.12}, observed: "positive", return_evidence_id: "SP-D05"}
  - {id: "SP-B06", round_available: 2, label: "Review vendor governance", description: "Determine whether control failure or deliberate product design enabled access.", cost: 2, correlation_group: "vendor-governance", likelihood_positive: {H1: 0.28, H2: 0.84, H3: 0.85, H4: 0.35}, observed: "positive", return_evidence_id: "SP-D06"}
  - {id: "SP-B07", round_available: 2, label: "Trace narrative propagation", description: "Separate content creation from later state amplification.", cost: 2, correlation_group: "video-narrative", likelihood_positive: {H1: 0.80, H2: 0.30, H3: 0.89, H4: 0.70}, observed: "positive", return_evidence_id: "SP-D07"}
  - {id: "SP-B08", round_available: 2, label: "Compare recovery strategies", description: "Test phased remediation against blanket shutdown.", cost: 2, correlation_group: "mitigation-testing", likelihood_positive: {H1: 0.45, H2: 0.70, H3: 0.75, H4: 0.72}, observed: "positive", return_evidence_id: "SP-D08"}

forecasts:
  - {id: "SP-F01", question: "Will forensic evidence show the compromised update was malicious rather than a benign defect?", horizon: "30 days", outcome: 1, resolution: "Joint build and incident forensic report."}
  - {id: "SP-F02", question: "Will evidence show Kandari operators created the original Sable implant?", horizon: "90 days", outcome: 0, resolution: "Corroborated development and access timeline."}
  - {id: "SP-F03", question: "Will a state-linked operator activate Sable access against military or logistics targets after public discovery?", horizon: "30 days", outcome: 1, resolution: "Independently corroborated network and host telemetry."}
  - {id: "SP-F04", question: "Will a financially motivated party seek payment or extortion for the original access?", horizon: "60 days", outcome: 1, resolution: "Verified marketplace, communications, or payment evidence."}
  - {id: "SP-F05", question: "Will the viral video prove materially edited or decontextualized?", horizon: "30 days", outcome: 1, resolution: "Independent audiovisual provenance analysis."}
  - {id: "SP-F06", question: "Will targeted segmentation preserve hospital care without confirmed destructive activation?", horizon: "30 days", outcome: 1, resolution: "Hospital operations and incident records."}

policy_levers:
  - {id: "SP-P01", label: "Targeted containment and recovery", description: "Revoke credentials, segment exposed systems, and prioritize essential-service continuity.", reversible: true, affected_domains: [cyber, public-safety, economy]}
  - {id: "SP-P02", label: "Joint vendor and criminal investigation", description: "Preserve evidence, investigate insider and broker activity, and compel transparent remediation.", reversible: true, affected_domains: [law-enforcement, cyber, regulation]}
  - {id: "SP-P03", label: "Graduated state response", description: "Attribute and respond separately to demonstrated Kandari exploitation while keeping origin claims conditional.", reversible: true, affected_domains: [diplomacy, cyber, defense]}
  - {id: "SP-P04", label: "Immediate public war attribution", description: "Declare Kandar the architect of the entire campaign and authorize broad retaliation before the access timeline is established.", reversible: false, affected_domains: [diplomacy, defense, cyber]}
  - {id: "SP-P05", label: "Supply-chain resilience reform", description: "Require reproducible builds, dual approval, token isolation, and shared incident telemetry.", reversible: false, affected_domains: [cyber, economy, regulation]}

policy_consequences:
  - {action_id: "SP-P01", consequence: "Essential services remain available while active command channels are disrupted.", probability_if_selected: 0.85, desirable: true}
  - {action_id: "SP-P02", consequence: "The broker and insider chain is established and recoverable evidence is preserved.", probability_if_selected: 0.78, desirable: true}
  - {action_id: "SP-P03", consequence: "Ardent imposes costs for verified state exploitation without making an unsupported origin claim.", probability_if_selected: 0.73, desirable: true}
  - {action_id: "SP-P04", consequence: "Allies dispute the overbroad attribution and Kandar exploits the error to justify escalation.", probability_if_selected: 0.69, desirable: false}
  - {action_id: "SP-P05", consequence: "Future signed-build compromise becomes harder and independently detectable.", probability_if_selected: 0.77, desirable: true}

critical_tasks:
  - {id: "SP-T01", criterion: "Preserve critical services while containing access.", critical: true, positive_action_ids: [SP-P01, SP-P05], prohibited_action_ids: []}
  - {id: "SP-T02", criterion: "Separate original access creation from later state exploitation.", critical: true, positive_action_ids: [SP-P02, SP-P03], prohibited_action_ids: [SP-P04]}
  - {id: "SP-T03", criterion: "Coordinate evidence-based attribution with allies and the vendor.", critical: false, positive_action_ids: [SP-P02, SP-P03], prohibited_action_ids: []}

rubric:
  - {id: "SP-R01", dimension: "alternatives", criterion: "Distinguishes implant origin from later operator use.", required_meaning: "Criminal or insider creation and Kandari exploitation can both be true, so attribution must be decomposed by stage and time.", minimum_depth: "analysis", acceptable_equivalents: [layered attribution, compound operation, access creation versus activation], required_evidence: true, allowed_evidence_ids: [SP-E05, SP-E06, SP-E07, SP-E08, SP-C03, SP-C04], near_misses: [multiple actors may be involved], critical: true}
  - {id: "SP-R02", dimension: "alternatives", criterion: "Discounts correlated threat reports and authentic-but-edited media.", required_meaning: "Repeated reseller claims are not independent and genuine audiovisual fragments can still create a false operational admission.", minimum_depth: "analysis", acceptable_equivalents: [circular reporting, decontextualized authentic media, source dependence], required_evidence: true, allowed_evidence_ids: [SP-E02, SP-E04, SP-C05, SP-C06], near_misses: [the video could be fake, reports may be wrong], critical: true}
  - {id: "SP-R03", dimension: "policy", criterion: "Recommends reversible containment and stage-specific attribution.", required_meaning: "Protect essential services and investigate the broker while calibrating any state response to verified exploitation rather than unsupported authorship.", minimum_depth: "recommendation", acceptable_equivalents: [phased response, targeted remediation, conditional attribution], required_evidence: false, near_misses: [improve cybersecurity, respond to Kandar], critical: true}
  - {id: "SP-R04", dimension: "memo", criterion: "States attribution and escalation reversal conditions.", required_meaning: "The memo specifies what build, payment, operator-timing, allied, or media evidence would change origin attribution and response intensity.", minimum_depth: "contingency", acceptable_equivalents: [attribution triggers, evidence thresholds, response off-ramps], required_evidence: false, near_misses: [monitor developments]}
  - {id: "SP-R05", dimension: "alternatives", criterion: "Explains why later exploitation does not establish original authorship.", required_meaning: "A state actor has incentives to exploit discovered access and amplify ambiguous media, while a broker or insider has separate financial incentives to create and sell the channel.", minimum_depth: "analysis", acceptable_equivalents: [opportunistic state use, access market precedes state operation, distinct incentive layers], required_evidence: true, allowed_evidence_ids: [SP-E03, SP-E05, SP-E06, SP-E07, SP-E08, SP-C03], near_misses: [multiple actors benefit], critical: true}
  - {id: "SP-R06", dimension: "alternatives", criterion: "Uses an integrated-operation counterfactual and traces premature attribution effects.", required_meaning: "A centrally planned Kandari attack should align build access, development, tasking, and activation timing; premature unitary attribution can hide the broker, impede remediation, and strengthen the information operation.", minimum_depth: "contingency", acceptable_equivalents: [timeline convergence counterfactual, attribution helps influence campaign, origin error impairs containment], required_evidence: true, allowed_evidence_ids: [SP-E02, SP-E05, SP-E06, SP-E07, SP-E08, SP-C03], near_misses: [attribution takes time], critical: true}

world_bible:
  resolved_hypothesis: H3
  hidden_truth: A debt-burdened Asterline engineer sold signed-build access to a criminal broker. Kandari operators discovered and selectively exploited the channel later, then amplified an authentic-but-edited video. Kandar did not create the implant but is responsible for the subsequent state operation.
  actor_motives:
    Asterline engineer: Obtain money while hiding misuse of signing credentials.
    Access broker: Resell privileged access and extort the vendor.
    Kandar: Exploit an unexpected opportunity against logistics and maximize political ambiguity.
    Asterline: Restore trust while minimizing disclosure of governance failures.
  causal_pathway:
    - An insider enables a criminal broker to insert and sign privileged code.
    - Shared threat reporting and edited media produce premature state attribution.
    - Kandari teams identify the disclosed access and activate a strategic subset.
    - Layered evidence permits stage-specific attribution and proportional response.
  surprise_type: compound cyber surprise caused by sequential actors rather than one integrated campaign
