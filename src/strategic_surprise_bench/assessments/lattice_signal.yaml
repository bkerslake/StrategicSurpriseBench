id: lattice_signal
title: Lattice Signal
domain: Emerging technology
version: 0.3.0
provenance_case: lattice_signal
role: You are advising Arken’s technology board.
background: Arken’s banks and public agencies use public-key encryption. Veyra is a rival state; Norland
  is a trading partner. The board must set next quarter’s technology spending this week. Replacing deployed
  systems would take several years.
initial_evidence:
- Veyra’s network ministry announced that it will retire its current encryption standards within six months.
  State television described foreign encryption as obsolete. No technical results accompanied the announcement.
- Two trade publications reported higher Veyran imports of cryogenic controllers. Both reports use the
  same customs data vendor; end users are not identified.
- A widely reported cryptocurrency theft involved a wallet whose owner had stored its private key in an
  exposed mobile backup.
- A Norland photonics supplier transferred interconnect patents to a public laboratory. Substrate purchases
  by the laboratory tripled from a low base. The registry does not list the intended application.
initial_rubric:
- dimension: adversarial
  stage: 1
  question: Does the assessment independently question a consequential claim or assumption using the record?
  zero: Treats the announcement or theft as proof of cryptographic capability, or asserts a bluff as established
    fact.
  one: Raises an evidence-based concern about the claim, such as the missing demonstration or ordinary
    explanation for the theft.
  two: Explains a plausible incentive to overstate capability, or a concrete alternative interpretation
    of the transition, and identifies evidence that would distinguish it from real capability. A technical
    verification proposal grounded in the missing results qualifies without using the word deception.
- dimension: systems
  stage: 1
  question: Does it explain a consequential indirect effect through a supported causal mechanism?
  zero: Lists technology risks without a causal link, or invents a confirmed Norland breakthrough.
  one: Identifies a possible downstream effect of the announcement or the long replacement timeline.
  two: Explains how reacting to an unverified claim could divert spending or disrupt dependent systems,
    or how slow replacement could leave exposure even after a later verification. Connects this to an
    actionable spending implication; Norland may be a lead, not a required hidden answer.
- dimension: uncertainty
  stage: 1
  question: Does its level of certainty fit the available evidence and distinguish what is known from
    what remains unresolved?
  zero: Expresses certainty about a breakthrough or bluff unsupported by the dossier.
  one: Acknowledges uncertainty but does not explain which observations constrain the conclusion.
  two: Separates the announced migration from demonstrated capability, discounts the theft as evidence
    of quantum computing, and treats shared customs reporting as one source or leaves the end-use interpretation
    unresolved. Exact numerical probabilities are not required.
- dimension: planning
  stage: 1
  question: Does it connect a decision objective to a necessary prerequisite and a practical next step?
  zero: Calls for wholesale replacement or passive waiting without a feasible next step.
  one: Suggests verification or preparedness but does not connect it to the board’s spending decision.
  two: Connects protecting deployed systems to a prerequisite such as an exposure inventory or independent
    technical test, then proposes a feasible action before the budget decision. Can stage spending while
    reserving a larger commitment for better evidence.
updates:
- id: a
  evidence:
  - One month later, auditors at three major Veyran banks find current encryption libraries still deployed
    and no approved implementation plan for the announced transition.
  - An authenticated ministry contract pays media firms according to foreign coverage of the announcement.
    It contains no engineering deliverables.
  - Norland’s laboratory says its new purchases support optical sensors. A visiting Arken engineer inspected
    a working sensor prototype but did not inspect all laboratory programs.
  adaptation:
    dimension: adaptation
    stage: 2
    question: Does the second assessment use the new evidence to revise or retain its judgments and recommendations
      appropriately?
    zero: Repeats a demonstrated cryptographic breakthrough or pivots to a certain Norland computing breakthrough.
    one: Recognizes that the Veyran claim is weaker but gives little explanation or no corresponding recommendation.
    two: Reduces confidence in imminent Veyran capability using the audit and communications evidence,
      avoids treating these as proof that all research is absent, and adjusts spending or verification
      accordingly. If initially skeptical, grounded retention with greater confidence qualifies.
- id: b
  evidence:
  - One month later, two separate Arken laboratories directly observe a Veyran processor completing previously
    unpublished test instances supplied at the session. Their reports agree that the results are reproducible
    and beyond the machines they have available.
  - The laboratories caution that the demonstration did not break deployed encryption keys and that scaling
    estimates remain uncertain.
  - Veyran banks provide signed transition contracts and compatible pilot deployments. Norland’s laboratory
    shows a working optical sensor prototype to a visiting Arken engineer.
  adaptation:
    dimension: adaptation
    stage: 2
    question: Does the second assessment use the new evidence to revise or retain its judgments and recommendations
      appropriately?
    zero: Dismisses the demonstration as propaganda without counterevidence, or claims deployed encryption
      has already been broken.
    one: Acknowledges the demonstration but does not meaningfully adjust urgency or distinguish demonstration
      from deployment-scale capability.
    two: Raises concern about actual capability and preparedness using the independent demonstration and
      deployment evidence, while preserving the scaling limitation. Revises or justifiably strengthens
      the recommendation instead of automatically insisting on a bluff.
