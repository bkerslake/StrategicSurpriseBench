id: meridian_shock
title: Meridian Shock
domain: Economic and financial
version: 0.3.0
provenance_case: meridian_shock
role: You are advising Pelora’s economic committee.
background: Pelora imports energy and food through the Meridian Canal in Nemer. Orbis is a major commodity
  trader that provides credit to importers. The committee must decide today whether to authorize emergency
  measures; the canal earns Nemer substantial transit revenue.
initial_evidence:
- Canal pilots report that a bulk carrier lost steering during a dust storm and blocked one channel. Initial
  photographs show no explosive damage.
- Nemer nationalist outlets claim commandos closed the canal, citing an unnamed source. The canal authority
  says salvage teams have access.
- Commodity exchange data show volatility tripling and unusually large variation-margin transfers by Orbis.
  Its cash position is not reported.
- Three shipping bulletins forecast a four-week closure using the same insurer model. Two importers say
  lenders have asked for additional collateral before renewing credit.
initial_rubric:
- dimension: adversarial
  stage: 1
  question: Does the assessment independently question a consequential claim or assumption using the record?
  zero: Treats sabotage claims or repeated closure estimates as established, or claims definite manipulation
    without support.
  one: Questions the sabotage account or repeated estimates.
  two: Explains an incentive or a source mechanism that could distort the account, grounded in the unnamed
    claim, shared model, or Nemer’s revenue interest, and proposes a relevant independent check.
- dimension: systems
  stage: 1
  question: Does it explain a consequential indirect effect through a supported causal mechanism?
  zero: Assumes canal reopening necessarily resolves all economic effects.
  one: Mentions financial stress or supply impacts without a mechanism.
  two: Links volatility to margin or collateral demands and then to reduced importer credit or essential-goods
    financing. Explains why financial effects could persist beyond reopening without predicting certain
    default.
- dimension: uncertainty
  stage: 1
  question: Does its level of certainty fit the available evidence and distinguish what is known from
    what remains unresolved?
  zero: Asserts definite sabotage, a four-week closure, or imminent Orbis default from the initial record.
  one: Acknowledges uncertain duration or finances.
  two: Separates physical duration from Orbis’s ability to meet calls, treats the bulletins as a shared
    estimate, and identifies missing liquidity or engineering evidence that limits confidence.
- dimension: planning
  stage: 1
  question: Does it connect a decision objective to a necessary prerequisite and a practical next step?
  zero: Proposes blanket sanctions or indiscriminate support with no prerequisites.
  one: Suggests a financial or engineering investigation generically.
  two: Connects protecting essential imports or containing losses to a concrete prerequisite, such as
    identifying near-term credit gaps or verifying salvage time, and proposes a feasible check that determines
    the scope of an emergency measure.
updates:
- id: a
  evidence:
  - The multinational salvage team expects reopening within seventy-two hours. Nemer authorizes continuous
    work and waives emergency fees.
  - The clearinghouse reports that Orbis exhausted two credit lines and pledged the same receipts through
    multiple affiliates. Its next margin payment is due tomorrow.
  - Two banks pause new importer credit while reconciling their Orbis exposures. Existing physical inventories
    cover approximately two weeks.
  adaptation:
    dimension: adaptation
    stage: 2
    question: Does the second assessment use the new evidence to revise or retain its judgments and recommendations
      appropriately?
    zero: Concludes that quick reopening removes the crisis or continues unsupported Nemer coercion attribution.
    one: Recognizes funding stress without changing the response.
    two: Shifts immediate attention toward the documented financing deadline and shared exposure while
      retaining reopening support; recommends targeted verification or containment and does not claim
      a default has already occurred.
- id: b
  evidence:
  - The multinational salvage team expects reopening within seventy-two hours. Nemer authorizes continuous
    work and waives emergency fees.
  - The clearinghouse confirms that Orbis met all calls using previously committed cash and has no overdue
    obligations. Independent reconciliation finds its collateral unencumbered.
  - The two importers report renewed credit on their previous terms. The insurer revises its four-week
    estimate after receiving the engineering report.
  adaptation:
    dimension: adaptation
    stage: 2
    question: Does the second assessment use the new evidence to revise or retain its judgments and recommendations
      appropriately?
    zero: Continues asserting an imminent Orbis cascade or deliberate Nemer blockade without supporting
      evidence.
    one: Recognizes improvement but retains an unexplained broad emergency response.
    two: Reduces concern about the proposed financing cascade and closure duration using the update, scales
      the recommendation to logistics and proportionate monitoring, and preserves a contingency without
      inventing hidden insolvency.
