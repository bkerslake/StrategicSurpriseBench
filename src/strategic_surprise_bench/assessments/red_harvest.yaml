id: red_harvest
title: Red Harvest
domain: Public health and security
version: 0.3.1
provenance_case: red_harvest
role: You are advising Oranta’s regional coordination council.
background: Lydon and Veska share a river border containing villages, wildlife markets, and a major freight
  road. Lydon’s Ravel Institute studies local animal diseases. The council must agree on border access
  and emergency purchasing arrangements tomorrow.
initial_evidence:
- Clinicians report twenty-three patients with a similar illness. Most of the earliest patients handled
  animals near a recently reported wildlife die-off.
- Veska cites an anonymous Ravel employee’s account of a laboratory escape and requests control of the
  border cordon. The employee has not been interviewed by the council.
- A surveillance consortium reports related illness in local wildlife before the recognized human cases.
  The chronology of all human cases remains incomplete.
- A newly registered distributor offers emergency treatment supplies at half the current tender price.
  The procurement office has not completed its supplier checks.
initial_rubric:
- dimension: adversarial
  stage: 1
  question: Does the assessment independently question a consequential claim or assumption using the record?
  zero: Treats the anonymous account as proven origin, or declares deliberate Veskan fabrication as fact.
  one: Questions the origin claim or Veska’s requested authority without linking the two or
    proposing a corroborating check.
  two: Explains that Veska’s request to control the cordon gives it an interest in the escape
    account; identifies what would corroborate or undercut the account, such as interviewing the
    employee or comparing early-case onset dates and the wildlife chronology with the alleged
    incident; and states a working judgment on origin. Falls short when limited to calling the
    account proven or fabricated, or a generic call to seek more information.
- dimension: systems
  stage: 1
  question: Does it explain a consequential indirect effect through a supported causal mechanism?
  zero: Treats identifying the origin as sufficient to resolve the response.
  one: Mentions access or supply quality as an additional issue without a pathway to harm or a
    council decision.
  two: Traces a specific pathway, such as border control interrupting care or freight to villages
    and worsening outcomes, or unchecked half-price supplies spreading unsafe stock across
    facilities; and connects the pathway to tomorrow’s access or purchasing decision. Falls short
    when limited to listing both issues without a mechanism, or claiming counterfeit products as
    fact.
- dimension: uncertainty
  stage: 1
  question: Does its level of certainty fit the available evidence and distinguish what is known from
    what remains unresolved?
  zero: Asserts a proven laboratory origin, natural origin, or fictitious illness from the initial record.
  one: Acknowledges uncertainty about origin or supplies without weighing the exposure chronology
    against the anonymous account.
  two: Separates the documented cluster from unresolved origin; weighs the early handlers’ exposure
    and the prior wildlife illness against the uncorroborated account; notes the incomplete
    chronology; and states a working judgment on origin that does not treat wildlife illness as
    excluding other pathways. Falls short when limited to asserting either origin, or refusing any
    judgment.
- dimension: planning
  stage: 1
  question: Does it connect a decision objective to a necessary prerequisite and a practical next step?
  zero: Waits for final origin attribution before all response, or approves unrestricted authority or
    purchases without checks.
  one: Suggests coordination or verification generically, or names a check without saying what
    agreement it enables.
  two: Names a prerequisite for tomorrow’s agreement, such as an independently mapped set of access
    needs, completed supplier checks, or monitored delivery arrangements; proposes who carries it
    out; and states what approval the check enables or withholds. Falls short when limited to
    waiting for origin attribution, or approving unrestricted authority or purchases.
updates:
- id: a
  evidence:
  - A joint clinical investigation confirms that early cases preceded the alleged laboratory incident
    and shared the wildlife-market exposure. Some later transmission links remain unresolved.
  - Observers document Veskan security checkpoints outside the agreed health perimeter. Two checkpoints
    block freight to villages with no recorded cases; the council has received no public-health justification.
  - An independent supply inspection finds falsified manufacturer documents for the new distributor’s
    shipment. The shipment has not yet been distributed.
  adaptation:
    dimension: adaptation
    stage: 2
    question: Does the second assessment use the new evidence to revise or retain its judgments and recommendations
      appropriately?
    zero: Ignores the access and supply findings after favoring natural exposure, or claims a complete
      origin resolution.
    one: Recognizes the additional concerns but gives no changed decision, or claims origin is
      resolved.
    two: Lowers support for the specific laboratory account by citing the early-case chronology;
      raises concern from the out-of-perimeter checkpoints and the falsified documents; changes
      tomorrow’s access or procurement recommendation in a specific way, such as requiring
      checkpoint withdrawal or halting the shipment; and keeps unresolved transmission open. Falls
      short when limited to unchanged decisions, or declaring the outbreak explained.
- id: b
  evidence:
  - A joint clinical investigation confirms that early cases preceded the alleged laboratory incident
    and shared the wildlife-market exposure. Some later transmission links remain unresolved.
  - Veska accepts an observer-supervised cordon matching the joint clinical map. Freight and clinical
    access logs show compliance over the following week, including opposition-administered villages.
  - Independent inspectors authenticate the distributor’s manufacturer documents and stock. The lower
    price comes from a documented donor subsidy; product suitability remains subject to the usual clinical
    review.
  adaptation:
    dimension: adaptation
    stage: 2
    question: Does the second assessment use the new evidence to revise or retain its judgments and recommendations
      appropriately?
    zero: Insists covert occupation or counterfeit stock is established, or treats authenticated supplies
      as proof of clinical effectiveness.
    one: Acknowledges reassurance but leaves unsupported political or procurement conclusions in
      place, or treats authentication as clinical suitability.
    two: Lowers the exploitation and falsification concerns by citing observed compliance and the
      authentication and subsidy findings; supports bounded cooperation; keeps clinical review and
      unresolved transmission as stated limits; and states what would reopen the concern. Falls
      short when limited to keeping the original suspicion, or treating authenticated stock as
      approved for use.
