id: black_current
title: Black Current
domain: Military and maritime
version: 0.3.1
provenance_case: black_current
role: You are advising Selene’s maritime council.
background: The Nacre Passage carries civilian shipping and contains data cables and a naval monitoring
  array. Selene controls access to an exclusion zone. Karsia disputes some navigation rules. The council
  must respond to an access request before the next high tide, in six hours.
initial_evidence:
- The coast guard reports a Karsian submarine aground inside the exclusion zone. Its forward compartment
  is flooded.
- Karsia requests entry for two rescue tugs and a signals-support ship. Its embassy attributes the grounding
  to navigation failure.
- Two cable operators report alarms within forty minutes of the grounding. Both alerts originated at the
  same shore monitoring station; neither operator has located physical damage.
- A commercial survey vessel with a current civilian permit spent the previous night west of the exclusion
  zone. Its track briefly disappears from the public vessel feed.
initial_rubric:
- dimension: adversarial
  stage: 1
  question: Does the assessment independently question a consequential claim or assumption using the record?
  zero: Assumes either deliberate attack or a harmless accident solely from the embassy statement, alarms,
    or missing vessel track.
  one: Recognizes that the embassy account or the requested access needs checking, or notes that a
    rescue could double as a collection opportunity, without a check that would tell the difference.
  two: Explains specifically why the rescue account can be true and the request still problematic,
    for example that a signals-support ship has no rescue function near a monitoring array; names a
    check achievable within six hours, such as crew and equipment logs, manifests, or supervised
    inspection, whose result determines which vessels are admitted; and states a working judgment.
    Falls short when limited to a generic call to verify the request, alleging a coordinated
    operation with the survey vessel without support, or a check whose result changes nothing.
- dimension: systems
  stage: 1
  question: Does it explain a consequential indirect effect through a supported causal mechanism?
  zero: Discusses only the submarine’s intent without operational consequences.
  one: Mentions crew safety, cable service, or escalation as a separate concern without showing how
    the council’s choice affects it.
  two: Traces a specific interaction, for example that refusing rescue endangers the crew and gives
    Karsia grounds to escalate while unrestricted support access puts the array and cables within
    reach; and uses that interaction to bound the response, such as admitting tugs under escort
    while holding the signals ship. Falls short when limited to listing risks on both sides without
    deriving a bounded response.
- dimension: uncertainty
  stage: 1
  question: Does its level of certainty fit the available evidence and distinguish what is known from
    what remains unresolved?
  zero: Treats two alarms as two confirmed cable attacks or the missing public track as proof of covert
    action.
  one: States that attribution is uncertain, or notes the shared monitoring station or the track
    gap, without weighing what each observation can support.
  two: Separates the confirmed grounding from unconfirmed cable damage and unknown intent; explains
    that two alarms from one station are one observation and that a feed gap is not evidence of
    covert activity; and states a working assessment that follows, rather than equal weight to all
    accounts. Falls short when limited to hedging every item equally, or treating either the
    accident or an attack as settled.
- dimension: planning
  stage: 1
  question: Does it connect a decision objective to a necessary prerequisite and a practical next step?
  zero: Demands immediate confrontation or indefinite investigation without addressing the tide deadline.
  one: Recommends a rescue, an investigation, or a delay without prerequisites, or without
    accounting for the tide deadline.
  two: Sequences steps that fit inside six hours, such as inspecting or escorting the tugs, fixing a
    route away from the array, and tasking a separate cable check; states which step gates admitting
    each vessel; and says what the council decides at the tide if a check is incomplete. Falls short
    when limited to indefinite investigation, confrontation, or steps with no gating relation to the
    access decision.
updates:
- id: a
  evidence:
  - A Selene inspection finds a failed navigation power unit and logged flooding before the submarine
    entered the zone. The crew accepts escorted rescue and submits its equipment inventory.
  - Both cable operators locate the alarms in a failed shore power supply. Traffic returns after repair;
    subsea tests find no break.
  - Port records and an independent harbor camera place the survey vessel at a civilian berth during the
    missing public track interval.
  adaptation:
    dimension: adaptation
    stage: 2
    question: Does the second assessment use the new evidence to revise or retain its judgments and recommendations
      appropriately?
    zero: Continues asserting a coordinated attack without new support, or abandons ordinary access precautions
      entirely.
    one: Accepts some mundane explanations but leaves the original attribution or response largely
      unchanged, or drops all precautions.
    two: Withdraws attack attribution for each now-explained observation, naming the navigation
      unit, the shore power supply, and the harbor camera; recommends supervised rescue and a
      proportionate stance toward Karsia; and justifies any retained precaution, such as an escort
      or equipment check, as ordinary practice rather than a surviving plot. Falls short when
      limited to a generic call to remain cautious without saying what changed.
- id: b
  evidence:
  - A Selene inspection finds a failed navigation power unit and logged flooding before the submarine
    entered the zone. The crew accepts escorted rescue.
  - A maintenance vehicle finds fresh tool marks and an unfamiliar attachment on one cable west of the
    grounding. No cable break is found near the submarine.
  - The survey vessel’s recovered work log records a stop at the attachment location outside its permitted
    work area. The cable owner says it authorized no work there; ownership inquiries are incomplete.
  adaptation:
    dimension: adaptation
    stage: 2
    question: Does the second assessment use the new evidence to revise or retain its judgments and recommendations
      appropriately?
    zero: Attributes all events to Karsia, or dismisses the cable findings because the submarine accident
      is real.
    one: Recognizes separate cable concerns but does not adjust the investigation or access
      recommendation, or attributes the cable activity to Karsia.
    two: Keeps the submarine accident as established while raising a distinct concern from the tool
      marks, the attachment, and the survey vessel’s out-of-area stop; redirects a specific action,
      such as securing the attachment site, examining the device, or holding the survey vessel and
      its permit; and withholds a state sponsor pending the ownership inquiry. Falls short when
      limited to folding the cable evidence back into a Karsian plot, or dismissing it because the
      grounding was real.
